# Dependabot for the Rust dependencies. The root workspace covers crates/*; gui/ and fuzz/ are
# separate Cargo workspaces with their own lockfiles, so they get their own entries.
# CI (ci.yml) runs on every pull_request, Dependabot PRs included.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      # llvm-sys is pinned with "=211.1.1" on purpose: LLVM 21 is the only supported LLVM
      # (docs/decisions.md, "LLVM bindings: llvm-sys 211"). Major bumps need a decision first.
      - dependency-name: "llvm-sys"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: "/gui"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # Cranelift is only on the spike/clift branch (yavs-clift, pinned "=0.137.0"); it is not on main.
  # Dependabot reads its config from the default branch and updates the manifest of the branch
  # named in target-branch, so this entry opens PRs against spike/clift only. Each PR is a signal to
  # re-run the clift benchmarks (docs/STATUS.md, "clift" section) before deciding anything; see
  # docs/decisions.md and issue #481. When yavs-clift merges into main, move the cranelift crates
  # into the main entry with an exact-pin policy like the llvm-sys entry above: major and minor
  # bumps are reviewed by hand, since 0.x minor releases are breaking.
  - package-ecosystem: cargo
    directory: "/"
    target-branch: "spike/clift"
    allow:
      - dependency-name: "cranelift*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(cranelift)"
    groups:
      cranelift:
        patterns: ["cranelift*"]
