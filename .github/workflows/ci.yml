# Root AGENTS.md rule 13 (#134, #888). The platform set follows the maintainer's matrix decision
# (docs/decisions.md "CI matrix", "CI scope"): the `plan` job (tools/ci-plan.py) reads the changed
# files. Every push and pull request runs Linux x86_64; Windows joins for source and build files;
# prose runs no build, user guide pages only the tests that read
# them. A nightly run (nightly.yml), a manual run and a release tag (release.yml calls this file) run
# every job on all three platforms.
# Job names are stable (`check (<os>)`, `clift (<os>)`, `corpus`, `vunit-yavs (<os>)`): a skipped
# platform has no job, so only the Linux names can be required checks on main, and `skipped` reports
# those names as passed when the scope leaves their job out. This workflow runs on every commit, so
# each commit has a CI result.
# The `check` job builds default features only; the `clift` job builds and tests the Cranelift tier
# (`--features clift`, #481), runs the difftest smoke and the whole corpus on process copies. The LLVM tier (`--features llvm`) has no CI
# job since 2026-10-30 (#898). The qemu/Wine ffi runs are not part of CI yet.
# The `corpus` job gates the analysis corpora (#63) and the discrepancy cases on Linux x86_64.
# The `versions` job checks that yavs, vunit-yavs and the VS Code extension carry one version (#903).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to a branch or pull request cancels the older run. On main and on tags every commit
# has a group of its own and finishes, so each main commit has a result (#888). github.workflow is the
# caller's name, so a release or nightly run has its own group.
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # What runs. github.event_name and github.ref are the caller's in a called workflow, so a tag run
  # of release.yml and a nightly.yml run are "full" on every platform without an input.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.p.outputs.scope }}
      pkg: ${{ steps.p.outputs.pkg }}
      os: ${{ steps.p.outputs.os }}
      vunit_os: ${{ steps.p.outputs.vunit_os }}
      stubs: ${{ steps.p.outputs.stubs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: python3 -I tools/ci-plan.py --selftest
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 -I tools/ci-plan.py

  # The required check names of the jobs this change does not need. A skipped matrix job does not
  # report its expanded name, so a required check would wait for it for ever.
  skipped:
    name: ${{ matrix.check }}
    needs: plan
    if: needs.plan.outputs.stubs != '[]'
    strategy:
      matrix:
        check: ${{ fromJSON(needs.plan.outputs.stubs) }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Nothing this job reads changed (tools/ci-plan.py, scope ${{ needs.plan.outputs.scope }})."

  # yavs, vunit-yavs and the VS Code extension carry one version (RELEASING.md)
  versions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 -I tools/release/bump.py --check

  check:
    name: check (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.scope != 'none'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
        if: needs.plan.outputs.scope == 'full'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        if: needs.plan.outputs.scope == 'full'
      - run: cargo test --workspace --locked --no-fail-fast
        if: needs.plan.outputs.scope == 'full'
      # Every Rust test that reads docs/, python/vunit-yavs/ or editors/vscode/.
      - name: Tests that read the changed pages and packages
        if: needs.plan.outputs.scope == 'light'
        run: cargo test -p yavs --locked --no-fail-fast --bin yavs --test docs_examples --test docs_debugger --test env_registry --test lint

  # The Cranelift tier (`--features clift`, no external dependency) on the same platforms.
  clift:
    name: clift (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clift
      - run: cargo clippy -p yavs-clift -p yavs --features clift --all-targets --locked -- -D warnings
      - run: cargo test -p yavs-clift -p yavs --features clift --locked --no-fail-fast
      - name: Unit tests with gc-stress
        if: runner.os == 'Linux'
        run: cargo test -p yavs-clift --features clift,gc-stress --locked --no-fail-fast
      - name: Simulation smoke with --tier=clift
        if: runner.os == 'Linux'
        run: |
          cargo build --locked -p yavs --features clift
          YAVS_BIN="$PWD/target/debug/yavs" python3 tools/difftest/difftest.py --candidate yavs-clift --no-sandbox --jobs 2 --filter '^(arith|delta|generics)/'
          # --tier=clift-auto with every function translated from its first call or jump, at 1 and 4 threads.
          YAVS_BIN="$PWD/target/debug/yavs" YAVS_RUN_FLAGS=--tier-heat=0,0,0 python3 tools/difftest/difftest.py --candidate yavs-clift-auto --threads 4 --no-sandbox --jobs 2 --filter '^(arith|delta|generics)/'
      # The other tiers reach hardly any process copy on the corpus, whose runs are short: here every
      # process that can have one has a copy from its third activation, with its facts and shape
      # facts, and every skip of a drive in generated code is held against the kernel's full test.
      - name: Corpus on process copies, skips checked
        if: runner.os == 'Linux'
        run: |
          YAVS_BIN="$PWD/target/debug/yavs" python3 tools/difftest/difftest.py --candidate yavs-clift-check --threads 1,4 --shuffle 11 --no-sandbox --jobs 4
      # The count rule of --tier=auto at its tightest: every function asked for at its first call, the
      # run waiting for the compile, so the rule's paths run on every test however short.
      - name: Corpus on the count rule at a count of 1
        if: runner.os == 'Linux'
        run: |
          YAVS_BIN="$PWD/target/debug/yavs" python3 tools/difftest/difftest.py --candidate yavs-clift-count1 --threads 1,4 --shuffle 11 --no-sandbox --jobs 4

  # Analysis corpora (tools/corpus): fetched at pinned revisions into the runner cache, never
  # part of the repository. Fails on any difference from the checked-in expected lists, in
  # both directions: a regression and an unexpected pass (bless it and review the diff).
  corpus:
    needs: plan
    if: needs.plan.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      YAVS_CORPUS: ${{ github.workspace }}/.corpus-cache
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: .corpus-cache
          key: corpus-${{ hashFiles('tools/fetch-corpus.sh') }}
      - run: tools/fetch-corpus.sh "$YAVS_CORPUS"
      - run: cargo build --release --locked -p yavs
      - name: Run every analysis corpus against its expected list
        run: |
          export PATH="$PWD/target/release:$PATH"
          failed=
          for t in tools/corpus/*.toml; do
            m=$(basename "$t" .toml)
            python3 tools/corpus/run.py "$m" --no-wrap --keep-going --out "$RUNNER_TEMP/corpus/$m" > "$RUNNER_TEMP/$m.log" 2>&1 \
              || { failed="$failed $m"; echo "::group::$m differs"; grep -h '^DIFF\|differ from' "$RUNNER_TEMP/$m.log"; echo "::endgroup::"; }
          done
          test -z "$failed" || { echo "corpora differing from their expected lists:$failed"; exit 1; }
      # yavs lint on what those runs built: no internal error, and the definite findings are the
      # confirmed ones.
      - name: Run yavs lint over the corpus libraries
        run: |
          PATH="$PWD/target/release:$PATH" YAVS_STD_CACHE="$RUNNER_TEMP/corpus/std" python3 tools/corpus/lint.py "$RUNNER_TEMP/corpus"
      # Discrepancy cases (tests/discrepancies): yavs's output must match each expected-yavs.
      # Reference simulators are not needed; only yavs is run.
      - name: Check the discrepancy cases against expected-yavs
        run: |
          YAVS_BIN="$PWD/target/release/yavs" python3 tools/discrepancies/run.py --sims yavs --check --no-sandbox
      - name: Run the reference simulators' own self-checking tests on their pass lists
        run: |
          export PATH="$PWD/target/release:$PATH"
          failed=
          for s in sim1 sim2; do
            python3 tools/difftest/external.py "$s" --oracle --no-sandbox --jobs 4 \
              --check "tools/difftest/external-$s.pass" || failed="$failed $s"
          done
          test -z "$failed" || { echo "external regression tests failing:$failed"; exit 1; }

  # The Python package python/vunit-yavs: unit tests, the fake end to end and the real-binary
  # tests (token server included) against this commit's yavs, on Linux and Windows.
  vunit-yavs:
    name: vunit-yavs (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.scope != 'none'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.vunit_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: cargo build --locked -p yavs
      - name: Package tests
        shell: bash
        env:
          # Light scope without a package change: only the package tests that read docs/.
          ONLY: ${{ needs.plan.outputs.scope == 'light' && needs.plan.outputs.pkg == 'false' && 'test_docs or test_guide_example or test_debugger_tutorial_demo' || '' }}
        run: |
          python -m pip install -e python/vunit-yavs pytest
          VUNIT_YAVS_PATH="$PWD/target/debug" YAVS_STD_CACHE="$RUNNER_TEMP/std" python -m pytest -v python/vunit-yavs/tests ${ONLY:+-k "$ONLY"}
