# Root AGENTS.md rule 13 on the three release platforms (#134). The `check` job builds default
# features only; the `llvm` job builds and tests the LLVM tier (`--features llvm`, LLVM 21) on the
# same three platforms (#127, #128); the `clift` job the Cranelift tier (`--features clift`, #481).
# The qemu/Wine ffi runs are not part of CI yet.
# The `corpus` job gates the analysis corpora (#63) and the discrepancy cases on Linux x86_64.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run. Tags are never cancelled
# (a release's CI call). github.workflow is the caller's name, so a release run has its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast

  # The LLVM tier on the three release platforms. LLVM 21 is pinned: apt.llvm.org on Linux, the
  # official release tarball (sha256-checked, trimmed, cached) on Windows; see
  # crates/yavs-llvm/WINDOWS.md. The simulation smoke runs a slice of tests/corpus with `--tier=llvm`,
  # with `--tier=auto`, with the default tier and with `--tier=interp`.
  llvm:
    name: llvm (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 4
      # Every run of the tests and the smoke generates code its pre-key found in the cache anyway
      # and fails when it is another module (#785).
      YAVS_LLVM_PREKEY_CHECK: 1
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: llvm
      - name: LLVM 21 (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y llvm-21-dev libzstd-dev
          echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"
      # Pinned LLVM 21 for MSVC, shared with the release workflow.
      - uses: ./.github/actions/llvm-windows
        if: runner.os == 'Windows'
      - name: Static C runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV'
      - run: cargo clippy -p yavs-llvm -p yavs --features llvm --all-targets --locked -- -D warnings
      - run: cargo test -p yavs-llvm -p yavs --features llvm --locked --no-fail-fast
      # The unit tests under the collect-at-every-safepoint build (#500); the difftest corpus
      # under it is a manual check (crates/yavs-interp/AGENTS.md section 5, about 100 times slower).
      - name: Unit tests with gc-stress
        if: runner.os == 'Linux'
        run: |
          cargo test -p yavs-interp --features gc-stress --locked --no-fail-fast
          cargo test -p yavs-llvm --features llvm,gc-stress --locked --no-fail-fast
      - name: Simulation smoke with --tier=llvm
        if: runner.os == 'Linux'
        run: |
          cargo build --locked -p yavs --features llvm
          # The default tier of this build (auto), then the interpreter alone.
          YAVS_BIN="$PWD/target/debug/yavs" python3 tools/difftest/difftest.py --candidate yavs --no-sandbox --jobs 2 --filter '^(arith|delta|generics)/'
          YAVS_BIN="$PWD/target/debug/yavs" python3 tools/difftest/difftest.py --candidate yavs-interp --no-sandbox --jobs 2 --filter '^(arith|delta|generics)/'
          YAVS_BIN="$PWD/target/debug/yavs" python3 tools/difftest/difftest.py --candidate yavs-llvm --no-sandbox --jobs 2 --filter '^(arith|delta|generics)/'
          # --tier=auto with every function compiled from its first call or jump: swap-ins in the
          # middle of each test, at 1 and 4 threads.
          YAVS_BIN="$PWD/target/debug/yavs" YAVS_RUN_FLAGS=--tier-heat=1,0,0 python3 tools/difftest/difftest.py --candidate yavs-auto --threads 4 --no-sandbox --jobs 2 --filter '^(arith|delta|generics|ieee)/'
          # A second run of each test links what the first compiled by the pre-keys of the compilation
          # cache; the check mode generates the code anyway and fails on any other module (#785).
          YAVS_BIN="$PWD/target/debug/yavs" YAVS_RUN_FLAGS=--tier-heat=1,0,0 python3 tools/difftest/difftest.py --candidate yavs-auto-warm --threads 4 --no-sandbox --jobs 2 --filter '^(arith|delta|generics|ieee)/'
      - name: Simulation smoke with --tier=auto3 (LLVM and Cranelift together)
        if: runner.os == 'Linux'
        run: |
          cargo clippy -p yavs --features llvm,clift --all-targets --locked -- -D warnings
          cargo build --locked -p yavs --features llvm,clift
          YAVS_BIN="$PWD/target/debug/yavs" python3 tools/difftest/difftest.py --candidate yavs-auto3-eager --threads 4 --no-sandbox --jobs 2 --filter '^(arith|delta|generics)/'

  # The Cranelift tier (`--features clift`, no external dependency) on the same three platforms.
  clift:
    name: clift (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clift
      - run: cargo clippy -p yavs-clift -p yavs --features clift --all-targets --locked -- -D warnings
      - run: cargo test -p yavs-clift -p yavs --features clift --locked --no-fail-fast
      - name: Unit tests with gc-stress
        if: runner.os == 'Linux'
        run: cargo test -p yavs-clift --features clift,gc-stress --locked --no-fail-fast
      - name: Simulation smoke with --tier=clift
        if: runner.os == 'Linux'
        run: |
          cargo build --locked -p yavs --features clift
          YAVS_BIN="$PWD/target/debug/yavs" python3 tools/difftest/difftest.py --candidate yavs-clift --no-sandbox --jobs 2 --filter '^(arith|delta|generics)/'
          # --tier=clift-auto with every function translated from its first call or jump, at 1 and 4 threads.
          YAVS_BIN="$PWD/target/debug/yavs" YAVS_RUN_FLAGS=--tier-heat=0,0,0 python3 tools/difftest/difftest.py --candidate yavs-clift-auto --threads 4 --no-sandbox --jobs 2 --filter '^(arith|delta|generics)/'

  # Analysis corpora (tools/corpus): fetched at pinned revisions into the runner cache, never
  # part of the repository. Fails on any difference from the checked-in expected lists, in
  # both directions: a regression and an unexpected pass (bless it and review the diff).
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      YAVS_CORPUS: ${{ github.workspace }}/.corpus-cache
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: .corpus-cache
          key: corpus-${{ hashFiles('tools/fetch-corpus.sh') }}
      - run: tools/fetch-corpus.sh "$YAVS_CORPUS"
      - run: cargo build --release --locked -p yavs
      - name: Run every analysis corpus against its expected list
        run: |
          export PATH="$PWD/target/release:$PATH"
          failed=
          for t in tools/corpus/*.toml; do
            m=$(basename "$t" .toml)
            python3 tools/corpus/run.py "$m" --no-wrap --keep-going --out "$RUNNER_TEMP/corpus/$m" > "$RUNNER_TEMP/$m.log" 2>&1 \
              || { failed="$failed $m"; echo "::group::$m differs"; grep -h '^DIFF\|differ from' "$RUNNER_TEMP/$m.log"; echo "::endgroup::"; }
          done
          test -z "$failed" || { echo "corpora differing from their expected lists:$failed"; exit 1; }
      # Discrepancy cases (tests/discrepancies): yavs's output must match each expected-yavs.
      # Reference simulators are not needed; only yavs is run.
      - name: Check the discrepancy cases against expected-yavs
        run: |
          YAVS_BIN="$PWD/target/release/yavs" python3 tools/discrepancies/run.py --sims yavs --check --no-sandbox
      - name: Run the reference simulators' own self-checking tests on their pass lists
        run: |
          export PATH="$PWD/target/release:$PATH"
          failed=
          for s in sim1 sim2; do
            python3 tools/difftest/external.py "$s" --oracle --no-sandbox --jobs 4 \
              --check "tools/difftest/external-$s.pass" || failed="$failed $s"
          done
          test -z "$failed" || { echo "external regression tests failing:$failed"; exit 1; }
