# One release per version with every artifact (RELEASING.md, docs/decisions.md "One release with
# every artifact", #903), on a `v[0-9]*` tag:
# - the version of yavs, vunit-yavs and the VS Code extension must equal the tag
#   (tools/release/bump.py --check);
# - the CI checks on the tagged commit, a release build of `yavs` per platform
#   (std/ieee built in, the Cranelift compiled tier, `--features clift`), one archive yavs-<version>-<target> each (docs/decisions.md
#   "Release archives", "One release archive per platform"); the Linux ones built with
#   cargo-zigbuild against glibc 2.17 and smoke-tested in centos:7;
# - the vunit-yavs wheel and sdist, tested on every platform against the archives of this run;
#   the VS Code extension (.vsix, vscode.yml) tested against the Linux x86_64 archive of this run;
# - the committed conformance report (docs/conformance.md and .json) as
#   yavs-<version>-conformance.md and .json;
# - one SHA256SUMS over everything, one GitHub pre-release with notes from
#   release_notes/<version>.md, and the wheel and sdist on PyPI (trusted publishing, environment
#   `pypi`).
# Not done here: the VS Code Marketplace and Open VSX (needs the maintainer's publisher tokens). Add
# a job after `publish` that downloads the `vsix` artifact and runs `vsce publish --packagePath`
# (secret VSCE_PAT) and `ovsx publish` (secret OVSX_PAT).
# workflow_dispatch with dry_run builds, tests and packages everything as workflow artifacts and
# publishes nothing.
name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and package only, do not publish
        type: boolean
        default: true
      checks:
        description: Run the CI checks first (a tag push always does)
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  versions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: yavs, vunit-yavs and the extension carry the release version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python3 -I tools/release/bump.py --check "${GITHUB_REF_NAME#v}"
          else
            python3 -I tools/release/bump.py --check
          fi

  checks:
    if: github.event_name == 'push' || inputs.checks
    uses: ./.github/workflows/ci.yml

  build:
    needs: [versions, checks]
    # Skipped checks (a dispatch without them) do not stop the build; failed ones do.
    if: ${{ !failure() && !cancelled() }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install zig and cargo-zigbuild
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/zb"
          "$RUNNER_TEMP/zb/bin/pip" install ziglang==0.14.1 cargo-zigbuild==0.23.4
          echo "$RUNNER_TEMP/zb/bin" >> "$GITHUB_PATH"
          rustup target add ${{ matrix.target }}
      - name: Version
        run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_ENV"
      - name: Build
        run: |
          t=${{ matrix.target }}
          mkdir -p stage
          if [[ "$RUNNER_OS" == Linux ]]; then
            # glibc 2.17; the target directory and the archive name stay the plain triple.
            cargo zigbuild --release --locked -p yavs --features clift --target $t.2.17
            cp target/$t/release/yavs stage/
            v=$(objdump -T stage/yavs | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n1)
            echo "stage/yavs: highest glibc symbol version: $v"
            [[ "$(printf '%s\n' GLIBC_2.17 "$v" | sort -V | tail -n1)" == GLIBC_2.17 ]] || { echo "needs more than glibc 2.17"; exit 1; }
            readelf -d stage/yavs | grep NEEDED
          else
            cargo build --release --locked -p yavs --features clift
            cp target/release/yavs.exe stage/
          fi
      - name: Package
        run: |
          t=${{ matrix.target }}
          mkdir dist
          # The built-in std/ieee sources are Apache-2.0 (lib/LICENSE, lib/SOURCES.md); the VITAL
          # packages are IEEE-copyrighted without a grant (lib/LICENSE-IEEE-VITAL); the Synopsys packages
          # keep their notice (lib/LICENSE-SYNOPSYS).
          name="yavs-$VERSION-$t"
          dir="dist/$name"
          mkdir -p "$dir"
          cp LICENSE-MIT LICENSE-APACHE README.md "$dir/"
          cp lib/LICENSE "$dir/LICENSE-IEEE"
          cp lib/LICENSE-IEEE-VITAL lib/LICENSE-SYNOPSYS "$dir/"
          cp stage/yavs* "$dir/"
          if [[ "$RUNNER_OS" == Windows ]]; then
            # No VHPI import library: plugins bring their own (user, 2026-10-18, #124).
            (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
          else
            (cd dist && tar czf "$name.tar.gz" "$name")
          fi
          ls -l dist/*.tar.gz dist/*.zip 2>/dev/null || true
      - name: Smoke test
        run: |
          t=${{ matrix.target }}
          cd dist
          printf 'entity t is end;\narchitecture a of t is begin\nprocess begin report "ok"; wait; end process;\nend;\n' > t.vhd
          name="yavs-$VERSION-$t"
          # Unpack the archive that was made, not the directory it was made from.
          rm -rf "$name"
          if [[ "$RUNNER_OS" == Windows ]]; then 7z x -y "$name.zip" > /dev/null; else tar xzf "$name.tar.gz"; fi
          w=wd
          # Smoke test: the binary alone runs a design (std/ieee built in).
          "$name/yavs" --version | tee version.txt
          grep -q 'compiled tier: cranelift' version.txt
          env -u YAVS_STDLIB "$name/yavs" analyze --work=work:$w t.vhd
          env -u YAVS_STDLIB "$name/yavs" run --work=work:$w t | grep -q ': ok'
          env -u YAVS_STDLIB "$name/yavs" run --tier=auto --work=work:$w t | grep -q ': ok'
          env -u YAVS_STDLIB "$name/yavs" run --tier=clift --work=work:$w t | grep -q ': ok'
          # Without LLVM the LLVM tier is refused (fail early, no fallback).
          if "$name/yavs" run --tier=llvm --work=work:$w t 2> err.txt; then echo "--tier=llvm ran without LLVM"; exit 1; fi
          grep -q E0120 err.txt
          # Linux: the same smoke test in the oldest environment the archive claims (glibc 2.17).
          # centos:7 is multi-arch, so the arm64 runner runs the arm64 image natively.
          if [[ "$RUNNER_OS" == Linux ]]; then
            docker run --rm -v "$PWD:/w" -w /w centos:7 sh -ec \
              "rm -rf w2; ldd $name/yavs; $name/yavs --version; $name/yavs analyze --work=work:w2 t.vhd && $name/yavs run --work=work:w2 t | grep -q ': ok' && $name/yavs run --tier=clift --work=work:w2 t | grep -q ': ok'"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: yavs-${{ matrix.target }}
          path: |
            dist/yavs-*.tar.gz
            dist/yavs-*.zip
          if-no-files-found: error

  # The vunit-yavs sdist and wheel
  python-dist:
    needs: versions
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: python/vunit-yavs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: vunit-yavs-dist
          path: python/vunit-yavs/dist/
          if-no-files-found: error

  # The package's tests (unit, fake end to end, real binary) against the wheel and the archive of
  # each platform built in this run
  vunit-yavs:
    needs: [build, python-dist]
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: yavs-${{ matrix.target }}
          path: ${{ runner.temp }}/yavs
      - uses: actions/download-artifact@v4
        with:
          name: vunit-yavs-dist
          path: ${{ runner.temp }}/dist
      - name: Unpack the archive, install the wheel
        run: |
          cd "$RUNNER_TEMP/yavs"
          if [[ "$RUNNER_OS" == Windows ]]; then 7z x -y yavs-*.zip > /dev/null; else tar xzf yavs-*.tar.gz; fi
          echo "VUNIT_YAVS_PATH=$(echo "$PWD"/yavs-*-${{ matrix.target }})" >> "$GITHUB_ENV"
          python -m pip install "$RUNNER_TEMP"/dist/*.whl pytest
      - name: Package tests
        run: |
          "$VUNIT_YAVS_PATH/yavs" --version
          cd "$RUNNER_TEMP"  # Out of the source tree, so the tests import the installed wheel
          YAVS_STD_CACHE="$RUNNER_TEMP/std" python -m pytest -v "$GITHUB_WORKSPACE/python/vunit-yavs/tests"

  # The VS Code extension against the Linux x86_64 archive of this run; uploads the artifact `vsix`
  vscode:
    needs: build
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/vscode.yml
    with:
      yavs_artifact: yavs-x86_64-unknown-linux-gnu

  publish:
    needs: [build, python-dist, vunit-yavs, vscode]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # Only the release files: the archives, the wheel and sdist, the .vsix
      - uses: actions/download-artifact@v4
        with:
          pattern: yavs-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: vunit-yavs-dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: dist
      - name: SHA256SUMS, notes and conformance report
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          test -s "release_notes/$version.md" || { echo "release_notes/$version.md is missing"; exit 1; }
          cat "release_notes/$version.md" - > notes.md <<NOTES

          ---

          The test runner package \`vunit-yavs\` $version is on PyPI (\`pip install vunit-yavs==$version\`); its wheel and sdist are attached too. The VS Code debugger extension: \`code --install-extension yavs-debug-$version.vsix\`. Verify every download with \`SHA256SUMS\`.
          NOTES
          # The committed report of the tagged commit; the conformance workflow fails a tag whose report is stale.
          for ext in md json; do
            test -s "docs/conformance.$ext" || { echo "docs/conformance.$ext is missing"; exit 1; }
            cp "docs/conformance.$ext" "dist/yavs-$version-conformance.$ext"
          done
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
          for f in yavs-$version-{x86_64-unknown-linux-gnu.tar.gz,aarch64-unknown-linux-gnu.tar.gz,x86_64-pc-windows-msvc.zip} \
            yavs-$version-conformance.{md,json} vunit_yavs-$version{-py3-none-any.whl,.tar.gz} yavs-debug-$version.vsix; do
            grep -q " $f\$" SHA256SUMS || { echo "$f is missing from the release files"; exit 1; }
          done
          [[ $(wc -l < SHA256SUMS) == 8 ]] || { echo "unexpected files in the release"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS-notes-and-conformance
          path: |
            dist/SHA256SUMS
            dist/yavs-*-conformance.md
            dist/yavs-*-conformance.json
            notes.md
          if-no-files-found: error
      - name: GitHub release
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --prerelease --verify-tag \
            --title "yavs ${GITHUB_REF_NAME#v}" --notes-file notes.md

  # vunit-yavs to PyPI by trusted publishing (OIDC, no tokens) after the GitHub release, so a refused
  # upload can be re-run alone. PyPI must list release.yml with environment `pypi` (RELEASING.md).
  pypi:
    needs: publish
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vunit-yavs-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Explain a refused upload
        if: failure()
        run: |
          echo "::error::PyPI refused vunit-yavs. If it says invalid-publisher: on pypi.org, project vunit-yavs, Publishing, add a GitHub trusted publisher with owner ru551n, repository yavs, workflow release.yml, environment pypi (RELEASING.md), then re-run this job."
          exit 1
