# Release on a `v*` tag (#165, docs/decisions.md "Release trigger and first release"): the CI
# checks on the tagged commit, a release build of `yavs` per platform (std/ieee built in),
# SHA256SUMS and a GitHub pre-release with notes from the version's CHANGELOG.md section
# (towncrier, run before tagging).
# workflow_dispatch with dry_run builds and packages the same archives as workflow artifacts
# and publishes nothing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and package only, do not publish
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $version"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: cargo build --release --locked -p yavs
      - name: Package
        run: |
          name="yavs-$VERSION-${{ matrix.target }}"
          mkdir -p "dist/$name"
          # The built-in std/ieee sources are Apache-2.0 (lib/LICENSE, lib/SOURCES.md).
          cp LICENSE-MIT LICENSE-APACHE README.md "dist/$name/"
          cp lib/LICENSE "dist/$name/LICENSE-IEEE"
          cd dist
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp ../target/release/yavs.exe "$name/"
            # No VHPI import library: plugins bring their own (user, 2026-10-18, #124).
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            cp ../target/release/yavs "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
          # Smoke test: the binary alone runs a design (std/ieee built in).
          printf 'entity t is end;\narchitecture a of t is begin\nprocess begin report "ok"; wait; end process;\nend;\n' > t.vhd
          env -u YAVS_STDLIB "$name/yavs" analyze --work=work:w t.vhd
          env -u YAVS_STDLIB "$name/yavs" run --work=work:w t | grep -q ': ok'
      - uses: actions/upload-artifact@v4
        with:
          name: yavs-${{ matrix.target }}
          path: |
            dist/yavs-*.tar.gz
            dist/yavs-*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS and notes
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          awk -v h="## yavs $version " 'index($0, h) == 1 { on = 1; next } on && /^## yavs / { exit } on' \
            CHANGELOG.md > notes.md
          grep -q . notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          cd dist && sha256sum yavs-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS-and-notes
          path: |
            dist/SHA256SUMS
            notes.md
      - name: GitHub release
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --prerelease --verify-tag \
            --title "yavs ${GITHUB_REF_NAME#v}" --notes-file notes.md
