# Release on a `v*` tag (#165, docs/decisions.md "Release trigger and first release"): the CI
# checks on the tagged commit, a release build of `yavs` and `yavs-gui` per platform (std/ieee
# built in; yavs-gui from the gui/ workspace, shipped in the same archive with its EUPL-1.2
# licence, docs/decisions.md "GUI (M10)"),
# SHA256SUMS and a GitHub pre-release with notes from release_notes/<version>.md (towncrier,
# collected and renamed in the commit that bumps the version).
# The Linux archives are built with cargo-zigbuild against glibc 2.17 (docs/decisions.md "Linux
# release archives") and smoke-tested in centos:7.
# workflow_dispatch with dry_run builds and packages the same archives as workflow artifacts
# and publishes nothing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and package only, do not publish
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  gui-checks:
    uses: ./.github/workflows/gui.yml

  build:
    needs: [checks, gui-checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            gui
      - name: Install zig and cargo-zigbuild
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/zb"
          "$RUNNER_TEMP/zb/bin/pip" install ziglang==0.14.1 cargo-zigbuild==0.23.4
          echo "$RUNNER_TEMP/zb/bin" >> "$GITHUB_PATH"
          rustup target add ${{ matrix.target }}
      - name: Version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $version"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            # glibc 2.17; the target directory and the archive name stay the plain triple.
            cargo zigbuild --release --locked -p yavs --target ${{ matrix.target }}.2.17
            (cd gui && cargo zigbuild --release --locked --target ${{ matrix.target }}.2.17)
            echo "BIN=target/${{ matrix.target }}/release/yavs" >> "$GITHUB_ENV"
            echo "GUI=gui/target/${{ matrix.target }}/release/yavs-gui" >> "$GITHUB_ENV"
            # The GUI loads its windowing and OpenGL libraries at run time; only glibc is linked.
            for b in target/${{ matrix.target }}/release/yavs gui/target/${{ matrix.target }}/release/yavs-gui; do
              v=$(objdump -T "$b" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n1)
              echo "$b: highest glibc symbol version: $v"
              [[ "$(printf '%s\n' GLIBC_2.17 "$v" | sort -V | tail -n1)" == GLIBC_2.17 ]] || { echo "needs more than glibc 2.17"; exit 1; }
            done
          else
            cargo build --release --locked -p yavs
            (cd gui && cargo build --release --locked)
            echo "BIN=target/release/yavs.exe" >> "$GITHUB_ENV"
            echo "GUI=gui/target/release/yavs-gui.exe" >> "$GITHUB_ENV"
          fi
      - name: Package
        run: |
          name="yavs-$VERSION-${{ matrix.target }}"
          mkdir -p "dist/$name"
          # The built-in std/ieee sources are Apache-2.0 (lib/LICENSE, lib/SOURCES.md); the VITAL
          # packages are IEEE-copyrighted without a grant (lib/LICENSE-IEEE-VITAL); the Synopsys packages
          # keep their notice (lib/LICENSE-SYNOPSYS); the 1993 numeric_std and numeric_bit keep the
          # IEEE 1076.3 notice (lib/LICENSE-IEEE-1993).
          cp LICENSE-MIT LICENSE-APACHE README.md "dist/$name/"
          cp lib/LICENSE "dist/$name/LICENSE-IEEE"
          cp lib/LICENSE-IEEE-VITAL lib/LICENSE-SYNOPSYS lib/LICENSE-IEEE-1993 "dist/$name/"
          # yavs-gui is EUPL-1.2 (libsurfer); this licence applies to the yavs-gui binary only
          # (README.md "License").
          cp gui/LICENSE "dist/$name/LICENSE-EUPL-1.2-yavs-gui"
          cp "$GUI" "dist/$name/"
          cd dist
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp "../$BIN" "$name/"
            # No VHPI import library: plugins bring their own (user, 2026-10-18, #124).
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            cp "../$BIN" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
          # Smoke test: the binary alone runs a design (std/ieee built in).
          printf 'entity t is end;\narchitecture a of t is begin\nprocess begin report "ok"; wait; end process;\nend;\n' > t.vhd
          env -u YAVS_STDLIB "$name/yavs" analyze --work=work:w t.vhd
          env -u YAVS_STDLIB "$name/yavs" run --work=work:w t | grep -q ': ok'
          # The GUI starts without a display for --version.
          "$name/yavs-gui" --version
          # Linux: the same smoke test in the oldest environment the archive claims (glibc 2.17).
          # centos:7 is multi-arch, so the arm64 runner runs the arm64 image natively.
          if [[ "$RUNNER_OS" == Linux ]]; then
            docker run --rm -v "$PWD:/w" -w /w centos:7 sh -ec \
              "rm -rf w2; $name/yavs analyze --work=work:w2 t.vhd && $name/yavs run --work=work:w2 t | grep -q ': ok' && $name/yavs-gui --version"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: yavs-${{ matrix.target }}
          path: |
            dist/yavs-*.tar.gz
            dist/yavs-*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS and notes
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          test -s "release_notes/$version.md" || { echo "release_notes/$version.md is missing"; exit 1; }
          cp "release_notes/$version.md" notes.md
          cd dist && sha256sum yavs-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS-and-notes
          path: |
            dist/SHA256SUMS
            notes.md
      - name: GitHub release
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --prerelease --verify-tag \
            --title "yavs ${GITHUB_REF_NAME#v}" --notes-file notes.md
