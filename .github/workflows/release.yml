# One release per version with every artifact (RELEASING.md, docs/decisions.md "One release with
# every artifact", #903), on a `v[0-9]*` tag:
# - the version of yavs, vunit-yavs and the VS Code extension must equal the tag
#   (tools/release/bump.py --check);
# - the CI checks on the tagged commit, a profile-guided release build of `yavs` per archive, trained on its
#   own runner with its own flags (tools/pgo, docs/decisions.md "Profile-guided release archives")
#   (std/ieee built in, the Cranelift compiled tier, `--features clift`), one archive yavs-<version>-<target> each (docs/decisions.md
#   "Release archives", "One release archive per platform"); the Linux ones built with
#   cargo-zigbuild against glibc 2.17 and smoke-tested in centos:7; the x86_64 ones twice: for x86-64-v3
#   (RUSTFLAGS, docs/decisions.md "x86-64-v3 baseline") under the plain name, and for the Rust default
#   CPU as yavs-<version>-<target>-compat; all smoke-tested on runners that have AVX2, and each binary runs the
#   tests/corpus differential tests;
# - the vunit-yavs wheel and sdist, tested on every platform against the archives of this run;
#   the VS Code extension (.vsix, vscode.yml) tested against the Linux x86_64 archive of this run;
# - the committed conformance report (docs/conformance.md and .json) as
#   yavs-<version>-conformance.md and .json, published only when the conformance run of the tag
#   passed (it regenerates the report at the tagged commit; job `conformance`, #1017);
# - one SHA256SUMS over everything, one GitHub pre-release with notes from
#   release_notes/<version>.md, and the wheel and sdist on PyPI (trusted publishing, environment
#   `pypi`).
# Not done here: the VS Code Marketplace and Open VSX (needs the maintainer's publisher tokens). Add
# a job after `publish` that downloads the `vsix` artifact and runs `vsce publish --packagePath`
# (secret VSCE_PAT) and `ovsx publish` (secret OVSX_PAT).
# workflow_dispatch with dry_run builds, tests and packages everything as workflow artifacts and
# publishes nothing.
name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and package only, do not publish
        type: boolean
        default: true
      checks:
        description: Run the CI checks first (a tag push always does)
        type: boolean
        default: true
      pgo_gain:
        description: Also build each archive without a profile and measure the difference (tools/pgo/gain.py)
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  versions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: yavs, vunit-yavs and the extension carry the release version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python3 -I tools/release/bump.py --check "${GITHUB_REF_NAME#v}"
          else
            python3 -I tools/release/bump.py --check
          fi

  checks:
    if: github.event_name == 'push' || inputs.checks
    uses: ./.github/workflows/ci.yml

  # The conformance run of this tag (conformance.yml: it regenerates the report at the tagged commit and
  # fails the run when the committed docs/conformance.md differs) must pass before anything is published
  # (#1017). A run on main proves nothing here: it only warns about a stale report. A dry run lists the
  # runs of the commit and never fails on them.
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - run: python3 -I tools/release/conformance_gate.py --selftest
      - name: The conformance run of the tag passed
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python3 -I tools/release/conformance_gate.py wait "$GITHUB_REF_NAME" "$GITHUB_SHA"
          else
            python3 -I tools/release/conformance_gate.py list "$GITHUB_SHA"
          fi

  build:
    needs: [versions, checks]
    # Skipped checks (a dispatch without them) do not stop the build; failed ones do.
    if: ${{ !failure() && !cancelled() }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, rustflags: "-C target-cpu=x86-64-v3", suffix: "" }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, rustflags: "", suffix: "-compat" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, rustflags: "", suffix: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, rustflags: "-C target-cpu=x86-64-v3", suffix: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, rustflags: "", suffix: "-compat" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # The plain x86_64 archives are built for x86-64-v3 (docs/decisions.md "x86-64-v3 baseline"), the
      # -compat ones for the Rust default CPU; CI and builds from source keep the default. A v3 binary
      # checks the CPU at start.
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v5
      # No rust-cache here: cargo does not see the content of a profile, so a cached dependency would keep an older one.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - name: Install zig and cargo-zigbuild
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/zb"
          "$RUNNER_TEMP/zb/bin/pip" install ziglang==0.14.1 cargo-zigbuild==0.23.4
          echo "$RUNNER_TEMP/zb/bin" >> "$GITHUB_PATH"
          rustup target add ${{ matrix.target }}
      - name: Version
        run: |
          echo "VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_ENV"
          # The CPU variant of the archive, named in its README.txt: x86-64-v3, compat or none (aarch64).
          case "${{ matrix.target }}${{ matrix.suffix }}" in
            x86_64-*-compat) echo "VARIANT=compat" >> "$GITHUB_ENV" ;;
            x86_64-*) echo "VARIANT=x86-64-v3" >> "$GITHUB_ENV" ;;
            *) echo "VARIANT=" >> "$GITHUB_ENV" ;;
          esac
      - name: Profile-guided build
        env:
          PGO_DIR: ${{ runner.temp }}/pgo
          PGO_JOBS: 3
        run: |
          t=${{ matrix.target }}
          exe=; [[ "$RUNNER_OS" == Windows ]] && exe=.exe
          mkdir -p stage
          # Linux: against glibc 2.17; the target directory and the archive name stay the plain triple. Zig cannot link the
          # profile runtime, so the instrumented build alone links with cc. Its command stays the same, or the profile matches
          # nothing (tools/pgo/AGENTS.md section 4).
          if [[ "$RUNNER_OS" == Linux ]]; then
            export PGO_BUILD="cargo zigbuild --release --locked -p yavs --features clift --target $t.2.17" PGO_INSTR_RUSTFLAGS="-C linker=cc"
          else
            export PGO_BUILD="cargo build --release --locked -p yavs --features clift --target $t"
          fi
          export PGO_BIN_REL="$t/release/yavs$exe"
          tools/pgo/build.sh "stage/yavs$exe"
          if [[ "$RUNNER_OS" == Linux ]]; then
            v=$(objdump -T stage/yavs | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n1)
            echo "stage/yavs: highest glibc symbol version: $v"
            [[ "$(printf '%s\n' GLIBC_2.17 "$v" | sort -V | tail -n1)" == GLIBC_2.17 ]] || { echo "needs more than glibc 2.17"; exit 1; }
            readelf -d stage/yavs | grep NEEDED
          fi
      - name: Package
        run: |
          t=${{ matrix.target }}
          mkdir dist
          # The built-in std/ieee sources are Apache-2.0 (lib/LICENSE, lib/SOURCES.md); the VITAL
          # packages are IEEE-copyrighted without a grant (lib/LICENSE-IEEE-VITAL); the Synopsys packages
          # keep their notice (lib/LICENSE-SYNOPSYS).
          name="yavs-$VERSION-$t${{ matrix.suffix }}"
          dir="dist/$name"
          mkdir -p "$dir"
          cp LICENSE-MIT LICENSE-APACHE "$dir/"
          # The Windows executable has the mimalloc allocator built in (MIT, crates/yavs/Cargo.toml).
          mi=
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp LICENSE-MIMALLOC "$dir/"
            mi="
            LICENSE-MIMALLOC   the licence of the memory allocator built into the simulator"
          fi
          cp lib/LICENSE "$dir/LICENSE-IEEE"
          cp lib/LICENSE-IEEE-VITAL lib/LICENSE-SYNOPSYS "$dir/"
          cp stage/yavs* "$dir/"
          # README.txt: the one text for all archives (it replaces the project README.md, which says
          # nothing about the archive). The first line is checked by the smoke test.
          exe=yavs; [[ "$RUNNER_OS" == Windows ]] && exe=yavs.exe
          case "$VARIANT" in
            x86-64-v3) what="It is built for x86-64-v3 and needs a CPU with AVX2, BMI1, BMI2, FMA, F16C, LZCNT and MOVBE
          (Intel Haswell, 2013, AMD Excavator or Zen, or newer). On an older CPU use the archive
          $name-compat from the same release page, which runs on any x86-64 CPU." ;;
            compat) what="It is built for the baseline x86-64 CPU and runs on any x86-64 CPU. On a CPU with AVX2 the archive
          without -compat in its name (built for x86-64-v3) may run faster; pick that one unless your CPU is old." ;;
            *) what="There is one archive for this platform." ;;
          esac
          cat > "$dir/README.txt" <<README
          yavs $VERSION ($t${VARIANT:+, $VARIANT})

          yavs is a VHDL simulator (VHDL-1993, 2008 and 2019). This archive holds the simulator for $t.
          $what
          It is a profile-guided build: built, trained on bundled testbenches on this platform, and built again with what
          those runs recorded.

          Files:
            $exe    the simulator; the std and ieee libraries are built in, nothing else needs installing
            README.txt   this file
            LICENSE-MIT, LICENSE-APACHE   the licences of yavs, MIT or Apache-2.0 at your option
            LICENSE-IEEE, LICENSE-IEEE-VITAL, LICENSE-SYNOPSYS   the licence and notices of the built-in
                                          std and ieee sources, the VITAL packages and the Synopsys packages$mi

          Start: put this directory on PATH, then
            yavs --version
            yavs analyze --work=work:build/work design.vhd
            yavs run --work=work:build/work top_entity

          Documentation: https://yavs.readthedocs.io/en/latest/
          Releases and SHA256SUMS: https://github.com/ru551n/yavs/releases
          Update: run the one-line install command again (https://yavs.readthedocs.io/en/latest/getting-started.html#one-line-install)
          README
          if [[ "$RUNNER_OS" == Windows ]]; then
            # No VHPI import library: plugins bring their own (user, 2026-10-18, #124).
            (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
          else
            (cd dist && tar czf "$name.tar.gz" "$name")
          fi
          ls -l dist/*.tar.gz dist/*.zip 2>/dev/null || true
      - name: Smoke test
        run: |
          t=${{ matrix.target }}
          cd dist
          printf 'entity t is end;\narchitecture a of t is begin\nprocess begin report "ok"; wait; end process;\nend;\n' > t.vhd
          name="yavs-$VERSION-$t${{ matrix.suffix }}"
          # Unpack the archive that was made, not the directory it was made from.
          rm -rf "$name"
          if [[ "$RUNNER_OS" == Windows ]]; then 7z x -y "$name.zip" > /dev/null; else tar xzf "$name.tar.gz"; fi
          w=wd
          # The binary of every archive, -compat included, is plain `yavs` (`yavs.exe`): only the archive name differs.
          exe=yavs; [[ "$RUNNER_OS" == Windows ]] && exe=yavs.exe
          set -- "$name"/yavs*
          [[ $# == 1 && "$1" == "$name/$exe" && -f "$1" ]] || { echo "$name must hold exactly one yavs file, named $exe; found: $*"; exit 1; }
          # The README of the archive is there and names this version, target and variant.
          [[ "$(head -n1 "$name/README.txt")" == "yavs $VERSION ($t${VARIANT:+, $VARIANT})" ]] \
            || { echo "$name/README.txt does not start with the version line"; exit 1; }
          cat "$name/README.txt"
          # Smoke test: the binary alone runs a design (std/ieee built in).
          "$name/yavs" --version | tee version.txt
          grep -q 'compiled tier: cranelift' version.txt
          # The second line says the CPU level the binary was compiled for (target features, not the archive name).
          case "$VARIANT" in
            x86-64-v3) want="Build: x86-64-v3, AVX2 support" ;;
            compat) want="Build: x86-64 baseline" ;;
            *) want="Build: aarch64" ;;
          esac
          [[ "$(sed -n 2p version.txt)" == "$want" ]] || { echo "second line of --version is not '$want'"; exit 1; }
          [[ "$(sed -n 3p version.txt)" == "Copyright (c) 2026 Sebastian Abrahamsson" ]]
          # The CPU check of main is compiled in only with x86-64-v3: the plain x86_64 archives must have
          # it, the -compat ones must not (they run on any x86-64 CPU).
          if [[ "$t" == x86_64-* ]]; then
            if [[ -z "${{ matrix.suffix }}" ]]; then
              grep -aq 'needs a CPU with x86-64-v3' "$name"/yavs*
            elif grep -aq 'needs a CPU with x86-64-v3' "$name"/yavs*; then
              echo "$name has the x86-64-v3 CPU check"; exit 1
            fi
          fi
          env -u YAVS_STDLIB "$name/yavs" analyze --work=work:$w t.vhd
          env -u YAVS_STDLIB "$name/yavs" run --work=work:$w t | grep -q ': ok'
          env -u YAVS_STDLIB "$name/yavs" run --tier=auto --work=work:$w t | grep -q ': ok'
          env -u YAVS_STDLIB "$name/yavs" run --tier=clift --work=work:$w t | grep -q ': ok'
          # The removed LLVM tier is refused (fail early, no fallback).
          if "$name/yavs" run --tier=llvm --work=work:$w t 2> err.txt; then echo "--tier=llvm ran"; exit 1; fi
          grep -q E0120 err.txt
          # Linux: the same smoke test in the oldest environment the archive claims (glibc 2.17).
          # centos:7 is multi-arch, so the arm64 runner runs the arm64 image natively.
          if [[ "$RUNNER_OS" == Linux ]]; then
            docker run --rm -v "$PWD:/w" -w /w centos:7 sh -ec \
              "rm -rf w2; ldd $name/yavs; $name/yavs --version; $name/yavs analyze --work=work:w2 t.vhd && $name/yavs run --work=work:w2 t | grep -q ': ok' && $name/yavs run --tier=clift --work=work:w2 t | grep -q ': ok'"
          fi
      - name: The corpus on the binary of the archive
        env:
          DIFFTEST_CACHE: ${{ runner.temp }}/difftest
        run: |
          cd "dist/yavs-$VERSION-${{ matrix.target }}${{ matrix.suffix }}"
          export YAVS_BIN="$PWD/yavs"
          cd "$GITHUB_WORKSPACE"
          for c in yavs-interp yavs-auto yavs-auto-warm yavs-clift yavs-clift-auto; do
            s=$SECONDS
            python3 tools/difftest/difftest.py --candidate "$c" --threads 4 --no-sandbox --jobs 4
            echo "$c: $((SECONDS - s)) s"
          done
      - name: The same build without a profile, and the difference
        if: inputs.pgo_gain
        run: |
          t=${{ matrix.target }}
          exe=; [[ "$RUNNER_OS" == Windows ]] && exe=.exe
          build="cargo build"; triple=$t
          [[ "$RUNNER_OS" == Linux ]] && { build="cargo zigbuild"; triple=$t.2.17; }
          CARGO_TARGET_DIR="$RUNNER_TEMP/plain" $build --release --locked -p yavs --features clift --target "$triple"
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get install -y "linux-tools-$(uname -r)" || echo "no perf for this kernel: timings only"
            sudo sysctl kernel.perf_event_paranoid=1 || true
          fi
          python3 -I tools/pgo/gain.py "$RUNNER_TEMP/plain/$t/release/yavs$exe" "dist/yavs-$VERSION-$t${{ matrix.suffix }}/yavs$exe" \
            --out "dist/gain-$t${{ matrix.suffix }}.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: inputs.pgo_gain
        with:
          name: pgo-gain-${{ matrix.target }}${{ matrix.suffix }}
          path: dist/gain-*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: yavs-${{ matrix.target }}${{ matrix.suffix }}
          path: |
            dist/yavs-*.tar.gz
            dist/yavs-*.zip
          if-no-files-found: error

  # The vunit-yavs sdist and wheel
  python-dist:
    needs: versions
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: python/vunit-yavs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: vunit-yavs-dist
          path: python/vunit-yavs/dist/
          if-no-files-found: error

  # The package's tests (unit, fake end to end, real binary) against the wheel and the archive of
  # each platform built in this run
  vunit-yavs:
    needs: [build, python-dist]
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: yavs-${{ matrix.target }}
          path: ${{ runner.temp }}/yavs
      - uses: actions/download-artifact@v4
        with:
          name: vunit-yavs-dist
          path: ${{ runner.temp }}/dist
      - name: Unpack the archive, install the wheel
        run: |
          cd "$RUNNER_TEMP/yavs"
          if [[ "$RUNNER_OS" == Windows ]]; then 7z x -y yavs-*.zip > /dev/null; else tar xzf yavs-*.tar.gz; fi
          echo "VUNIT_YAVS_PATH=$(echo "$PWD"/yavs-*-${{ matrix.target }})" >> "$GITHUB_ENV"
          python -m pip install "$RUNNER_TEMP"/dist/*.whl pytest
      - name: Package tests
        run: |
          "$VUNIT_YAVS_PATH/yavs" --version
          cd "$RUNNER_TEMP"  # Out of the source tree, so the tests import the installed wheel
          YAVS_STD_CACHE="$RUNNER_TEMP/std" python -m pytest -v "$GITHUB_WORKSPACE/python/vunit-yavs/tests"

  # The VS Code extension against the Linux x86_64 archive of this run; uploads the artifact `vsix`
  vscode:
    needs: build
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/vscode.yml
    with:
      yavs_artifact: yavs-x86_64-unknown-linux-gnu

  publish:
    needs: [conformance, build, python-dist, vunit-yavs, vscode]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # Only the release files: the archives, the wheel and sdist, the .vsix
      - uses: actions/download-artifact@v4
        with:
          pattern: yavs-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: vunit-yavs-dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: dist
      - name: SHA256SUMS, notes and conformance report
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          test -s "release_notes/$version.md" || { echo "release_notes/$version.md is missing"; exit 1; }
          cat "release_notes/$version.md" - > notes.md <<NOTES

          ---

          The test runner package \`vunit-yavs\` $version is on PyPI (\`pip install vunit-yavs==$version\`); its wheel and sdist are attached too. The VS Code debugger extension: \`code --install-extension yavs-debug-$version.vsix\`. Verify every download with \`SHA256SUMS\`.
          NOTES
          # The committed report of the tagged commit; the `conformance` job above has waited for the conformance run of the tag, which fails when this report is stale.
          for ext in md json; do
            test -s "docs/conformance.$ext" || { echo "docs/conformance.$ext is missing"; exit 1; }
            cp "docs/conformance.$ext" "dist/yavs-$version-conformance.$ext"
          done
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
          for f in yavs-$version-{x86_64-unknown-linux-gnu{,-compat}.tar.gz,aarch64-unknown-linux-gnu.tar.gz,x86_64-pc-windows-msvc{,-compat}.zip} \
            yavs-$version-conformance.{md,json} vunit_yavs-$version{-py3-none-any.whl,.tar.gz} yavs-debug-$version.vsix; do
            grep -q " $f\$" SHA256SUMS || { echo "$f is missing from the release files"; exit 1; }
          done
          [[ $(wc -l < SHA256SUMS) == 10 ]] || { echo "unexpected files in the release"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS-notes-and-conformance
          path: |
            dist/SHA256SUMS
            dist/yavs-*-conformance.md
            dist/yavs-*-conformance.json
            notes.md
          if-no-files-found: error
      - name: GitHub release
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --prerelease --verify-tag \
            --title "yavs ${GITHUB_REF_NAME#v}" --notes-file notes.md

  # vunit-yavs to PyPI by trusted publishing (OIDC, no tokens) after the GitHub release, so a refused
  # upload can be re-run alone. PyPI must list release.yml with environment `pypi` (RELEASING.md).
  pypi:
    needs: publish
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vunit-yavs-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Explain a refused upload
        if: failure()
        run: |
          echo "::error::PyPI refused vunit-yavs. If it says invalid-publisher: on pypi.org, project vunit-yavs, Publishing, add a GitHub trusted publisher with owner ru551n, repository yavs, workflow release.yml, environment pypi (RELEASING.md), then re-run this job."
          exit 1
