# The VS Code debugger extension (editors/vscode): the DAP client test, the test in a real
# headless VS Code, and `vsce package`; the .vsix is uploaded as the artifact `vsix`. On its own it
# tests against this commit's yavs (a debug build); release.yml calls it with `yavs_artifact`, the
# Linux x86_64 archive built in the same run, and publishes the .vsix (RELEASING.md).
name: VS Code extension

on:
  push:
    branches: [main]
    paths: ["editors/vscode/**", "crates/yavs-dap/**", ".github/workflows/vscode.yml"]
  pull_request:
    paths: ["editors/vscode/**", "crates/yavs-dap/**", ".github/workflows/vscode.yml"]
  workflow_call:
    inputs:
      yavs_artifact:
        description: Artifact of this run holding the yavs Linux x86_64 archive to test against
        type: string
        default: ""

permissions:
  contents: read

# Same pattern as ci.yml: a newer push cancels the older run, tags are never cancelled. The prefix
# keeps a release run's call out of the group of its ci.yml call (github.workflow is the caller's).
concurrency:
  group: vscode-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # VS Code (Electron) needs these libraries; the test runs it headless under xvfb.
      - name: System libraries for VS Code
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgbm1 libnss3 libasound2t64 libgtk-3-0t64 libxkbfile1 libsecret-1-0
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.yavs_artifact == ''
      - uses: Swatinem/rust-cache@v2
        if: inputs.yavs_artifact == ''
      - name: Build yavs
        if: inputs.yavs_artifact == ''
        run: |
          cargo build --locked -p yavs
          echo "YAVS=$PWD/target/debug/yavs" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        if: inputs.yavs_artifact != ''
        with:
          name: ${{ inputs.yavs_artifact }}
          path: ${{ runner.temp }}/yavs-archive
      - name: Unpack the yavs archive
        if: inputs.yavs_artifact != ''
        run: |
          cd "$RUNNER_TEMP/yavs-archive"
          tar xzf yavs-*.tar.gz
          echo "YAVS=$(echo "$PWD"/yavs-*-x86_64-unknown-linux-gnu/yavs)" >> "$GITHUB_ENV"
      - run: |
          echo "YAVS_STD_CACHE=$RUNNER_TEMP/yavs-std" >> "$GITHUB_ENV"
          "$YAVS" --version
      # The extension has no dependencies; these are only what its tests and packaging use.
      - name: Install test and packaging tools
        run: |
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/npm" \
            @vscode/debugadapter-testsupport@1.68.0 @vscode/test-electron@3.1.0 @vscode/vsce@4.1.0
          echo "NODE_PATH=$RUNNER_TEMP/npm/node_modules" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: DAP client test
        working-directory: editors/vscode
        run: node test/client.js "$YAVS"
      - name: Test in a headless VS Code
        working-directory: editors/vscode
        run: xvfb-run -a node test/vscode/run.js "$YAVS"
      - name: Package
        working-directory: editors/vscode
        run: |
          version=$(node -p 'require("./package.json").version')
          vsce package --out "yavs-debug-$version.vsix"
          unzip -l "yavs-debug-$version.vsix" | grep -E ' extension/(extension\.js|package\.json)$' | wc -l | grep -qx 2
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: editors/vscode/yavs-debug-*.vsix
          if-no-files-found: error
