# Read the Docs builds the documentation on every push, with the same Sphinx as the docs
# workflow in .github/workflows/docs.yml.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
