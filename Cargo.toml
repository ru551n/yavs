[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/ru551n/rsim"

[workspace.dependencies]
rsim-diag = { path = "crates/rsim-diag" }
rsim-syntax = { path = "crates/rsim-syntax" }
annotate-snippets = "0.12.16"
clap = { version = "4.6.7", features = ["derive"] }
rayon = "1.12"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]

[profile.release]
debug = "line-tables-only"
