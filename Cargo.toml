[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/ru551n/yavs"

[workspace.dependencies]
yavs-diag = { path = "crates/yavs-diag" }
yavs-syntax = { path = "crates/yavs-syntax" }
annotate-snippets = "0.12.16"
clap = { version = "4.6.7", features = ["derive"] }
rayon = "1.12"
yavs-logic = { path = "crates/yavs-logic" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]

[profile.release]
debug = "line-tables-only"
