[package]
name = "rsim"
description = "rsim VHDL simulator command line"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
rsim-diag.workspace = true
rsim-elab = { path = "../rsim-elab" }
rsim-kernel = { path = "../rsim-kernel" }
rsim-lib = { path = "../rsim-lib" }
rsim-sem = { path = "../rsim-sem" }
rsim-std = { path = "../rsim-std" }
rsim-syntax.workspace = true

[lints]
workspace = true

[features]
# Builds the external parse corpus test (needs RSIM_CORPUS, see tools/fetch-corpus.sh).
corpus = []

[[test]]
name = "corpus"
required-features = ["corpus"]
