[package]
name = "yavs-cache"
description = "On-disk compilation cache store for yavs: keys, atomic writes, validation, cleaning"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sha2 = "0.11"
memmap2 = "0.9.11"
twox-hash = { version = "2.1", default-features = false, features = ["xxhash3_64", "std"] }

[dev-dependencies]
tempfile = "3"

# Not `workspace = true`: the workspace forbids unsafe code, and `forbid` cannot be relaxed by a
# crate attribute. Mapping a file needs unsafe, so this crate denies it everywhere and allows it
# only in `map`.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

# Its own `main`: the check needs the process's main thread (the allocator's `brk` heap).
[[test]]
name = "huge_heap"
harness = false
