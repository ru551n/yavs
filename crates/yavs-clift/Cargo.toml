[package]
name = "yavs-clift"
description = "Cranelift tier for yavs: IR to machine code without an LLVM install"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Off by default, like the LLVM tier: `cargo test -p yavs-clift --features clift`.
clift = [
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-jit",
    "dep:cranelift-module",
    "dep:cranelift-native",
    "dep:yavs-cache",
]
# The interpreter's collect-at-every-safepoint build for the unit tests.
gc-stress = ["yavs-interp/gc-stress"]

[dependencies]
# `incremental-cache`: the compiled code of a function kept across runs (`src/cache.rs`).
cranelift-codegen = { version = "=0.137.0", optional = true, features = ["incremental-cache"] }
cranelift-frontend = { version = "=0.137.0", optional = true }
cranelift-jit = { version = "=0.137.0", optional = true }
cranelift-module = { version = "=0.137.0", optional = true }
cranelift-native = { version = "=0.137.0", optional = true }
yavs-cache = { path = "../yavs-cache", optional = true }
yavs-interp = { path = "../yavs-interp" }
yavs-ir = { path = "../yavs-ir" }
yavs-llvm = { path = "../yavs-llvm" }

# Like yavs-llvm: machine code and raw function pointers need unsafe, confined to this crate.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[dev-dependencies]
yavs-diag.workspace = true
yavs-kernel = { path = "../yavs-kernel" }
