[package]
name = "yavs-cycle"
description = "Cycle mode for yavs: a region of processes run on a static schedule with compiled code"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The versions of yavs-clift: one Cranelift in the build.
cranelift-codegen = { version = "=0.137.0", features = ["incremental-cache"] }
cranelift-frontend = "=0.137.0"
cranelift-jit = "=0.137.0"
cranelift-module = "=0.137.0"
cranelift-native = "=0.137.0"
yavs-cache = { path = "../yavs-cache" }
yavs-diag.workspace = true
yavs-elab = { path = "../yavs-elab" }
yavs-ir = { path = "../yavs-ir" }
yavs-kernel = { path = "../yavs-kernel" }
yavs-rt = { path = "../yavs-rt" }
yavs-sem = { path = "../yavs-sem" }
yavs-std = { path = "../yavs-std" }
yavs-syntax.workspace = true

# Generated code and raw pointers need unsafe, confined to `src/codegen.rs`.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
