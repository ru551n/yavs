[package]
name = "yavs-ffi"
description = "Dependency-free per-ABI call trampolines for VHPIDIRECT foreign subprograms"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true

# Not `workspace = true`: the workspace forbids unsafe code, and `forbid`
# cannot be relaxed by a crate attribute. Calling a C function through a
# raw pointer needs unsafe, so this crate denies it everywhere and allows
# it only in `sys` (the asm trampolines and the one call into them).
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
