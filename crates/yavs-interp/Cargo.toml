[package]
name = "yavs-interp"
description = "yavs IR interpreter: runs IR processes on yavs-kernel and elaboration code without it"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test builds only: collect at every safepoint after an allocation and never reuse a slot,
# so a missed root shows as an access to a deallocated object (#422, AGENTS.md).
gc-stress = []

[dependencies]
yavs-diag.workspace = true
yavs-ffi = { path = "../yavs-ffi" }
yavs-ir = { path = "../yavs-ir" }
yavs-kernel = { path = "../yavs-kernel" }
yavs-logic.workspace = true
yavs-std = { path = "../yavs-std" }

[lints]
workspace = true
