[package]
name = "yavs-logic"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "IEEE 1164 std_ulogic scalar and packed logic vectors for yavs"

[features]
# Make the 4-bit nibble layout the default LogicVec representation (default: 4 bit-planes).
nibbles = []

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"

[[bench]]
name = "layout"
harness = false

[lints]
workspace = true

[[bench]]
name = "wide"
harness = false
