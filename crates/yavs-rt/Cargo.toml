[package]
name = "yavs-rt"
description = "Runtime of the yavs compiled tier: tier-up policy, host functions, native-frame loop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The interpreter's collect-at-every-safepoint build for the unit tests:
# cargo test -p yavs-rt --features gc-stress
gc-stress = ["yavs-interp/gc-stress"]
# Count the callbacks of compiled code in release builds too (always counted in debug builds).
op-census = ["yavs-interp/op-census"]
# Release builds check that `lean` activations (`regs::no_table`) never reach the object table
# (always checked in debug builds): the difftest build of #766.
table-check = []

[dependencies]
yavs-interp = { path = "../yavs-interp" }
yavs-kernel = { path = "../yavs-kernel" }
yavs-ir = { path = "../yavs-ir" }
yavs-cache = { path = "../yavs-cache" }

# Not `workspace = true`: the workspace forbids unsafe_code, and compiled code
# calls this runtime through raw pointers. It denies unsafe_code and allows it
# at the crate root with a comment instead.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[dev-dependencies]
yavs-diag.workspace = true
yavs-interp = { path = "../yavs-interp" }
yavs-ir = { path = "../yavs-ir" }
yavs-kernel = { path = "../yavs-kernel" }
tempfile = "3"
