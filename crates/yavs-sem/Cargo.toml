[package]
name = "yavs-sem"
description = "VHDL-2008/2019 semantic analysis for yavs: libraries, scopes, types, overloading, typed HIR"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
sha2 = "0.11"
twox-hash = { version = "2.1", default-features = false, features = ["xxhash3_128", "std"] }
smallvec.workspace = true
postcard.workspace = true
rustc-hash.workspace = true
yavs-diag.workspace = true
yavs-lib = { path = "../yavs-lib" }
yavs-std = { path = "../yavs-std" }
yavs-syntax.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[features]
# Builds tests/hdl_modules.rs (needs the corpus from tools/fetch-corpus.sh).
corpus = []

[[test]]
name = "hdl_modules"
required-features = ["corpus"]
