[package]
name = "yavs-vhpi"
description = "IEEE 1076 VHPI C ABI for yavs: exported vhpi_* symbols and plugin loading"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# Lets downstream build scripts (the yavs CLI) read the generated export
# files through DEP_YAVS_VHPI_* variables.
links = "yavs_vhpi"

[dependencies]
yavs-diag.workspace = true
libloading = "0.9.0"

[build-dependencies]
cc = "1.8.0"

[dev-dependencies]
cc = "1.8.0"

# Not `workspace = true`: the workspace forbids unsafe code, and `forbid`
# cannot be relaxed by a crate attribute. A C ABI layer needs unsafe, so
# this crate keeps it allowed and confined to `abi`, `plugin` and `shim.c`.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
