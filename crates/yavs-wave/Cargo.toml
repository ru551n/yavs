[package]
name = "yavs-wave"
description = "Waveform recording sink: hierarchy and value changes to FST"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wavefst = { version = "0.4.0", default-features = false, features = ["writer", "lz4"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
yavs-elab = { path = "../yavs-elab" }
yavs-kernel = { path = "../yavs-kernel" }
yavs-sem = { path = "../yavs-sem" }

[dev-dependencies]
wellen = "0.25.7"
tempfile = "3"

[lints]
workspace = true
