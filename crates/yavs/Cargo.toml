[package]
name = "yavs"
description = "yavs VHDL simulator command line"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
serde_json = "1"
yavs-cache = { path = "../yavs-cache" }
yavs-cov = { path = "../yavs-cov" }
yavs-diag.workspace = true
yavs-dap = { path = "../yavs-dap" }
yavs-elab = { path = "../yavs-elab" }
yavs-interp = { path = "../yavs-interp" }
yavs-ir = { path = "../yavs-ir" }
yavs-kernel = { path = "../yavs-kernel" }
yavs-lib = { path = "../yavs-lib" }
yavs-sem = { path = "../yavs-sem" }
yavs-std = { path = "../yavs-std" }
yavs-syntax.workspace = true
yavs-wave = { path = "../yavs-wave" }
yavs-llvm = { path = "../yavs-llvm", optional = true }
yavs-clift = { path = "../yavs-clift", optional = true }
yavs-vhpi = { path = "../yavs-vhpi" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
sha2 = "0.11"

[lints]
workspace = true

[features]
# Builds the external parse corpus test (needs YAVS_CORPUS, see tools/fetch-corpus.sh).
corpus = []
# The LLVM tier (`yavs run --tier=llvm`); needs LLVM 21 (crates/yavs-llvm/AGENTS.md).
llvm = ["dep:yavs-llvm", "yavs-llvm/llvm"]
# The Cranelift tier (`yavs run --tier=clift`); no LLVM needed (crates/yavs-clift/AGENTS.md).
clift = ["dep:yavs-clift", "dep:yavs-llvm", "yavs-clift/clift"]
# Test builds only: the heap collection stress mode of yavs-interp (crates/yavs-interp/AGENTS.md).
gc-stress = ["yavs-interp/gc-stress"]
# Op and adjacent-pair census of the interpreter, printed at the end of `yavs run` (crates/yavs-interp/AGENTS.md).
op-census = ["yavs-interp/op-census", "yavs-llvm?/op-census"]
# Panic when a compiled activation marked lean reaches the object table (crates/yavs-llvm/AGENTS.md).
table-check = ["yavs-llvm?/table-check"]

[[test]]
name = "corpus"
required-features = ["corpus"]

[dev-dependencies]
cc = "1.8.0"
serde_json = "1"
tempfile = "3"
wellen = "0.25.7"
