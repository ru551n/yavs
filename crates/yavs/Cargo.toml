[package]
name = "yavs"
description = "yavs VHDL simulator command line"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
yavs-cache = { path = "../yavs-cache" }
yavs-cov = { path = "../yavs-cov" }
yavs-diag.workspace = true
yavs-dap = { path = "../yavs-dap" }
yavs-elab = { path = "../yavs-elab" }
yavs-interp = { path = "../yavs-interp" }
yavs-kernel = { path = "../yavs-kernel" }
yavs-lib = { path = "../yavs-lib" }
yavs-sem = { path = "../yavs-sem" }
yavs-std = { path = "../yavs-std" }
yavs-syntax.workspace = true
yavs-wave = { path = "../yavs-wave" }
yavs-llvm = { path = "../yavs-llvm", optional = true }
yavs-vhpi = { path = "../yavs-vhpi" }

[lints]
workspace = true

[features]
# Builds the external parse corpus test (needs YAVS_CORPUS, see tools/fetch-corpus.sh).
corpus = []
# The LLVM tier (`yavs run --tier=llvm`); needs LLVM 21 (crates/yavs-llvm/AGENTS.md).
llvm = ["dep:yavs-llvm", "yavs-llvm/llvm"]
# Test builds only: the heap collection stress mode of yavs-interp (crates/yavs-interp/AGENTS.md).
gc-stress = ["yavs-interp/gc-stress"]

[[test]]
name = "corpus"
required-features = ["corpus"]

[dev-dependencies]
cc = "1.8.0"
serde_json = "1"
tempfile = "3"
wellen = "0.25.7"
