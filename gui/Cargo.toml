# yavs-gui: its own workspace (docs/design/gui.md section 7), EUPL-1.2 because libsurfer is.
# It depends on no yavs crate and talks to `yavs run --dap` only.
[workspace]

[package]
name = "yavs-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "EUPL-1.2"
description = "Graphical debugger for the yavs VHDL simulator"
repository = "https://github.com/ru551n/yavs"
publish = false

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui_dock = "0.21.1"
# Not on crates.io: pinned to a revision of its main branch (user, 2026-10-19). Used from G4 on
# (waves); pinned now so every slice builds against the same egui and wellen.
libsurfer = { git = "https://gitlab.com/surfer-project/surfer", rev = "1cdbaa9514ea15b06a186d23979dbb38ab774ad1", default-features = false }
serde_json = "1"

[dev-dependencies]
egui_kittest = "0.36.1"
