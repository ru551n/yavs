[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vunit-yavs"
version = "0.10.1"
description = "The yavs VHDL simulator for VUnit, as a VUnit package"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
# The first VUnit release with simulator packages (the vunit_pkg.toml key 'simulator')
dependencies = ["vunit_hdl>=5.0.0.dev16"]

[project.urls]
Source = "https://github.com/ru551n/yavs/tree/main/python/vunit-yavs"

[tool.setuptools]
packages = ["vunit_yavs"]

[tool.setuptools.package-data]
vunit_yavs = ["vunit_pkg.toml"]

[tool.black]
line-length = 120
