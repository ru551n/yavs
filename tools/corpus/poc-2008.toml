[[source]]
id = "poc"
url = "https://github.com/VLSI-EDA/PoC"
commit = "8c39b2407a97ec81b8601c4b64e4d2e2141ab9cf"
license = "Apache-2.0"
# Chair of VLSI-Design (TU Dresden) Pile of Cores, archived; the project's own simulation package PoC.simulation

# Test benches in the compile list above: how they are run, what passing means, and their top units.
[testbenches]
runner = "poc.sh sim2|sim3 <tb entity> (PoC's own tool chain; *.files list each bench's dependencies); equivalently sim2 -r <tb>"
passes = "PoC.simulation: the bench calls simAssert/simFinish and prints 'SIMULATION RESULT = PASSED'; severity failure on a failed assertion"

[[testbenches.bench]]
lib = "test"
source = "poc"
path = "tb/arith/arith_addw_tb.vhdl"
top = "arith_addw_tb"
vunit = false

