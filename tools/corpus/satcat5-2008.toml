[[source]]
id = "satcat5"
url = "https://github.com/the-aerospace-corporation/satcat5"
commit = "58402dcbe64adc9c30d00c08edc20e3aef314ac6"
license = "CERN-OHL-W-2.0"
# Aerospace Corporation SatCat5 Ethernet switch/FPGA library

# Test benches in the compile list above: how they are run, what passing means, and their top units.
[testbenches]
runner = "plain VHDL benches (*_tb), one entity each, run by the project's sim/ scripts for sim3/Vivado; any simulator with --stop-time works"
passes = "no 'assert ... severity error' fires (benches use assert with severity error and finish by running out of stimulus)"

