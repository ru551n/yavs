commit = "7c4449ee5027d933ee3d7c0465bd0a5d06f9c05e"
license = "Apache-2.0"
# VHDL-2008 and VHDL-2019 feature tests, one self-contained VUnit test bench per language feature

# Test benches in the compile list above: how they are run, what passing means, and their top units.
[testbenches]
runner = "run.py of the project (VUnit; uses sim1/sim4/other simulators with 2019, others with 2008); each bench is one test case"
passes = "VUnit test case passes (test_runner_cleanup, no error()). Stub benches for unimplemented LCS issues call error() on purpose and are expected to FAIL when run"

[[testbenches.bench]]
lib = "vhdl_2008"
source = "vhdl-compliance"
path = "vhdl_2008/tb_aggregate.vhd"
top = "tb_aggregate"
vunit = true

[[testbenches.bench]]
lib = "vhdl_2008"
source = "vhdl-compliance"
path = "vhdl_2008/tb_array_scalar.vhd"
