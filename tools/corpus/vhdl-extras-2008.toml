# Test benches in the compile list above: how they are run, what passing means, and their top units.
[testbenches]
runner = "makefile + scripts/ (sim3, sim3 -c <entity> -do 'run -all; quit'); each test_* entity stands alone"
passes = "the bench ends by itself; failures are 'assert ... severity error/failure' (the project scripts grep the log for '** Error' / '** Failure')"

