# Extra analyze flags per tool (UVVM has non-protected shared variables).
[flags]
sim1 = []
yavs = []

[[source]]
id = "vunit"
url = "https://github.com/VUnit/vunit"
commit = "d627259f9795f28f3d1f57a3a3de9f9978bd49b8"
license = "MPL-2.0"
# sparse: /vunit/vhdl/ and /examples/vhdl/

[[source]]
id = "osvvm"
url = "https://github.com/OSVVM/OSVVM"
commit = "2104430dbbd2c7c1fff2ee02e1996944c59b62c2"
# VUnit's bundled OSVVM copy (VUnit submodule vunit/vhdl/osvvm, 2023.04)

# Test benches in the compile list above: how they are run, what passing means, and their top units.
[testbenches]
runner = "the module's run.py / examples/vhdl/*/run.py with VUnit itself (python3 run.py --sim1|--sim2); VUnit's own tests are in vunit/vhdl/*/test"
passes = "every test case reports pass: VUnit test_runner_cleanup with no failed check. tb_*_failed style benches are written to expect failures via mock/unmock and pass overall"

