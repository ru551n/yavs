# Real-world performance suite: one [[test]] per testbench, read by tools/realbench/run.py (see AGENTS.md).
#
# Fields: name, category, why (what it adds to the mix), source (checkout id, see tools/fetch-corpus.sh) and path (the
# main file, relative to it), top and toplib (the entity and its library), corpus (analysis-corpus manifests of
# tools/corpus whose libraries are built first), files (extra files analysed on top: lib, source, path or glob;
# lib "@module" = the directory after `modules/`), data (files {source, path} copied into the working directory of the run),
# relaxed, generics (-gNAME=VALUE), vunit (true = all test cases, or one test case name), stop (--stop-time), std,
# ok (regex the output must match), excluded (reason; the test is listed but only runs with --tests or --include-excluded). A `driver` test
# (driver args and pick) takes its library set and run command from a recorded run of tools/suites.
# Nothing here is copied from the sources: they are read in place from the corpus cache.

[[test]]
name = "hdlm_fifo_sync"
category = "rtl-datapath"
why = "Synchronous FIFO with random stalls: clocked process pair, queue-based VUnit checking"
source = "hdl-modules"
path = "modules/fifo/test/tb_fifo.vhd"
top = "tb_fifo"
toplib = "fifo"
corpus = ["hdl-modules-2008", "vunit-2008"]
vunit = true
generics = ["seed=1", "depth=64"]
files = [
  { lib = "@module", source = "hdl-modules", glob = "modules/bfm/sim/*.vhd" },
  { lib = "@module", source = "hdl-modules", glob = "modules/register_file/sim/*.vhd" },
  { lib = "@module", source = "hdl-modules", path = "modules/fifo/test/tb_fifo.vhd" },
]

